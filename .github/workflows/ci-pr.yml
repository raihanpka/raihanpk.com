# Pull Request Gate. Runs once per pull request and never on a plain push to a feature branch.
# Make it a required status check in branch protection. Keep it fast: no services, no deploy.
# Same commands the agent runs locally (see the gate line in AGENTS.md).

name: Pull Request Web Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run check
      - name: Token lint
        run: bun run check:tokens
      - name: Build
        run: bun run build
      - name: Test
        run: bun test
